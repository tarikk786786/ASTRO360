      .astro-ring-outer {
        position: absolute;
        width: 100%;
        height: 100%;
        border-radius: 50%;
        border: 2px solid rgba(251, 191, 36, 0.2);
        border-top-color: #fbbf24;
        animation: astro-spin 3s linear infinite;
      }
      .astro-ring-inner {
        position: absolute;
        width: 75%;
        height: 75%;
        border-radius: 50%;
        border: 2px dashed rgba(6, 182, 212, 0.3);
        border-bottom-color: #06b6d4;
        animation: astro-spin-reverse 2s linear infinite;
      }
      .astro-core-gem {
        position: relative;
        width: 44px;
        height: 44px;
        border-radius: 14px;
        background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);

        display: flex;

        justify-content: center;
        box-shadow: 0 0 25px rgba(251, 191, 36, 0.3);
        animation: astro-pulse 2s ease-in-out infinite;

      .astro-core-gem svg {

        height: 24px;
        color: #fbbf24;
      }
      .astro-brand-title {
        margin-top: 24px;
        font-size: 20px;
        font-weight: 900;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        background: linear-gradient(135deg, #ffffff 30%, #fbbf24 80%, #06b6d4 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .astro-brand-subtitle {
        margin-top: 6px;
        font-size: 11px;
        font-family: monospace;
        letter-spacing: 0.08em;
        color: #94a3b8;
        text-align: center;
      }
      .astro-progress-track {
        margin-top: 20px;
        width: 160px;
        height: 3px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 999px;
        overflow: hidden;
        position: relative;
      }
      .astro-progress-fill {
        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
        width: 50%;
        background: linear-gradient(90deg, #fbbf24, #06b6d4);
        border-radius: 999px;
        animation: astro-progress-indeterminate 1.5s ease-in-out infinite;
      }
      @keyframes astro-spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes astro-spin-reverse {
        from { transform: rotate(360deg); }
        to { transform: rotate(0deg); }
      }
      @keyframes astro-pulse {
        0%, 100% { transform: scale(1); opacity: 0.9; }
        50% { transform: scale(1.06); opacity: 1; filter: drop-shadow(0 0 12px rgba(251, 191, 36, 0.6)); }
      }
      @keyframes astro-progress-indeterminate {
        0% { left: -50%; width: 50%; }
        50% { left: 25%; width: 60%; }
        100% { left: 100%; width: 50%; }
      }
    </style>

    <!-- Cache Busting & Auto-Recovery Script -->
    <script>
      // Clear stale service worker caches if new build deployed
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (var registration of registrations) {
            registration.update();
          }
        });
      }
      // Catch stale script loading errors and reload
      window.addEventListener('error', function(e) {
        if (e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK')) {
          if (!sessionStorage.getItem('reloaded_for_stale_cache')) {
            sessionStorage.setItem('reloaded_for_stale_cache', 'true');
            if ('caches' in window) {
              caches.keys().then(function(names) {
                return Promise.all(names.map(function(name) { return caches.delete(name); }));
              }).then(function() {
                window.location.reload();
              });
            } else {
              window.location.reload();
            }
          }
        }
      }, true);
    </script>
