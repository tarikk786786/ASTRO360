<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Smooth Animated Color Cycle Filter -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="astroRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="coreSun" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes colorCycle {
      0% { filter: hue-rotate(0deg); }
      50% { filter: hue-rotate(180deg); }
      100% { filter: hue-rotate(360deg); }
    }
    @keyframes orbitPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    .animated-favicon-group {
      animation: colorCycle 8s linear infinite;
      transform-origin: center;
    }
    .pulsing-core {
      animation: orbitPulse 3s ease-in-out infinite;
      transform-origin: center;
    }
  </style>

  <!-- Background Base -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <g class="animated-favicon-group">
    <!-- Outer Glowing Zodiac Ring -->
    <circle cx="256" cy="256" r="190" fill="none" stroke="url(#astroRing)" stroke-width="14" opacity="0.9" filter="url(#glow)" />
    <circle cx="256" cy="256" r="140" fill="none" stroke="#38bdf8" stroke-width="6" stroke-dasharray="16 12" opacity="0.7" />

    <!-- 3D Orbit Ellipse Ring -->
    <ellipse cx="256" cy="256" rx="180" ry="70" fill="none" stroke="url(#astroRing)" stroke-width="10" transform="rotate(-30 256 256)" opacity="0.85" />

    <!-- Central Glowing Core Sol -->
    <circle class="pulsing-core" cx="256" cy="256" r="55" fill="url(#coreSun)" filter="url(#glow)" />

    <!-- Crescent Moon Accent -->
    <path d="M 285 220 A 35 35 0 1 0 315 280 A 45 45 0 1 1 285 220 Z" fill="#e0f2fe" opacity="0.9" />

    <!-- Sparkle Stars -->
    <polygon points="256,100 262,118 280,124 262,130 256,148 250,130 232,124 250,118" fill="#fef08a" />
    <polygon points="120,256 124,268 136,272 124,276 120,288 116,276 104,272 116,268" fill="#38bdf8" />
    <polygon points="392,256 396,268 408,272 396,276 392,288 388,276 376,272 388,268" fill="#c084fc" />
  </g>
</svg>
